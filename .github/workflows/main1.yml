name: Build APK
on:
  push:
    paths:
      - 'www/index.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build APK
        run: |
          # পুরোনো জঞ্জাল মুছে ফেলা
          rm -rf android package.json package-lock.json capacitor.config.json node_modules
          
          # প্রজেক্ট ইনিশিয়ালাইজ করা
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # www ফোল্ডার নিশ্চিত করা
          mkdir -p www
          
          # ক্যাপাসিটর সেটআপ
          npx cap init "ConverterApp" com.jajahid.app --web-dir www
          npx cap add android
          npx cap sync android
          
          # গ্র্যাডল পারমিশন ও বিল্ড
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-final-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
