name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Project
        run: |
          # পুরোনো জঞ্জাল পরিষ্কার করা
          rm -rf android package.json package-lock.json capacitor.config.json node_modules
          
          # প্রজেক্ট ইনিশিয়ালাইজ করা
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # www ফোল্ডার এবং index.html নিশ্চিত করা
          mkdir -p www
          if [ ! -f "www/index.html" ]; then echo "<html><body><h1>Build Successful</h1></body></html>" > www/index.html; fi
          
          # ক্যাপাসিটর সেটআপ
          npx cap init "My Converter" com.jajahid.app --web-dir www
          
          # অ্যান্ড্রয়েড প্ল্যাটফর্ম যোগ এবং সিঙ্ক
          npx cap add android
          npx cap sync android

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # গ্র্যাডল লাইসেন্স একসেপ্ট করা এবং বিল্ড করা
          yes | ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
