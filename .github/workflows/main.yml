name: Build APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build From Scratch
        run: |
          # সব পুরোনো ফাইল মুছে নতুন করে শুরু করা
          rm -rf android package.json package-lock.json node_modules capacitor.config.json
          
          # ফোল্ডার চেক করা
          mkdir -p www
          if [ ! -f "www/index.html" ]; then echo "<h1>Test</h1>" > www/index.html; fi
          
          # প্রজেক্ট ইনিশিয়ালাইজ
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # ক্যাপাসিটর সেটআপ
          npx cap init "MyConverter" com.jajahid.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Grant Execute Permission
        run: chmod +x android/gradlew

      - name: Compile APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
