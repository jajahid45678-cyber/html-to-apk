name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Initialize Project
        run: |
          # পুরোনো ফাইল পরিষ্কার করা
          rm -rf android package.json package-lock.json capacitor.config.json
          
          # প্রজেক্ট সেটআপ
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # www ফোল্ডার এবং ফাইল নিশ্চিত করা
          mkdir -p www
          if [ ! -f "www/index.html" ]; then echo "<h1>Build Success</h1>" > www/index.html; fi
          
          # ক্যাপাসিটর কনফিগ তৈরি
          npx cap init "My App" com.example.app --web-dir www
          
          # অ্যান্ড্রয়েড যুক্ত করা এবং সিঙ্ক
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
