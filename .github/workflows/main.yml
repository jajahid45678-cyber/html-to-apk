name: Build APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Prepare Project
        run: |
          # যদি আগে থেকে কোনো ফাইল থাকে তা পরিষ্কার করা
          rm -rf android package.json package-lock.json node_modules
          mkdir -p www
          # একটি ডিফল্ট index.html তৈরি করা (যদি না থাকে)
          if [ ! -f "www/index.html" ]; then echo "<h1>Hello</h1>" > www/index.html; fi
          
          # প্রজেক্ট ইনিশিয়ালাইজ করা
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # ক্যাপাসিটর সেটআপ
          npx cap init "My Converter App" com.jajahid.app --web-dir www
          npx cap add android

      - name: Sync and Build APK
        run: |
          npx cap sync
          cd android
          # গ্র্যাডল ফাইলকে পারমিশন দেওয়া
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
